<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6",
                        "background-dark": "#0a0c10",
                        "modal-dark": "#161b22",
                        "input-dark": "#0d1117",
                        "border-dark": "#30363d",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body { font-family: 'Manrope', sans-serif; }
        .backdrop-blur-heavy { backdrop-filter: blur(16px); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-background-dark font-display text-slate-100 min-h-screen">
<div class="fixed inset-0 z-0 overflow-hidden opacity-20 pointer-events-none">
<div class="max-w-[1200px] mx-auto p-8 flex flex-col gap-8">
<header class="flex justify-between items-center py-4 border-b border-slate-800">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-blue-600 rounded-lg"></div>
<span class="text-xl font-bold tracking-tight">BudgetApp</span>
</div>
<div class="flex gap-4">
<div class="w-32 h-8 bg-slate-800 rounded"></div>
<div class="w-8 h-8 bg-slate-800 rounded-full"></div>
</div>
</header>
<div class="grid grid-cols-3 gap-6">
<div class="h-32 bg-slate-800 rounded-xl"></div>
<div class="h-32 bg-slate-800 rounded-xl"></div>
<div class="h-32 bg-slate-800 rounded-xl"></div>
</div>
<div class="h-96 bg-slate-800 rounded-xl"></div>
</div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 backdrop-blur-heavy bg-black/70">
<div class="bg-modal-dark w-full max-w-[540px] rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-border-dark overflow-hidden">
<div class="flex items-center justify-between px-8 pt-8 pb-4">
<h2 class="text-2xl font-bold tracking-tight text-white">Quick Add Transaction</h2>
<button class="text-slate-500 hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<form class="px-8 pb-8 space-y-6">
<div class="flex p-1 bg-input-dark border border-border-dark rounded-xl">
<label class="flex-1 cursor-pointer">
<input checked="" class="hidden peer" name="transaction_type" type="radio" value="expense"/>
<div class="flex items-center justify-center py-2.5 rounded-lg text-sm font-semibold transition-all peer-checked:bg-border-dark peer-checked:text-white text-slate-400">
                        Expense
                    </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="hidden peer" name="transaction_type" type="radio" value="income"/>
<div class="flex items-center justify-center py-2.5 rounded-lg text-sm font-semibold transition-all peer-checked:bg-border-dark peer-checked:text-white text-slate-400">
                        Income
                    </div>
</label>
</div>
<div class="relative group">
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Amount</label>
<div class="flex items-center border-b-2 border-border-dark focus-within:border-primary transition-colors py-2">
<span class="text-3xl font-light text-slate-500 mr-3">$</span>
<input class="w-full bg-transparent border-none p-0 text-5xl font-bold focus:ring-0 placeholder:text-slate-800 text-white" placeholder="0.00" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-6">
<div class="col-span-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Description</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl">notes</span>
<input class="w-full pl-11 pr-4 py-3 bg-input-dark border border-border-dark rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-white placeholder:text-slate-600" placeholder="What was this for?" type="text"/>
</div>
</div>
<div>
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl">calendar_today</span>
<input class="w-full pl-11 pr-4 py-3 bg-input-dark border border-border-dark rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-white color-scheme-dark" type="date" value="2023-10-27"/>
</div>
</div>
<div>
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Category</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl">category</span>
<select class="w-full pl-11 pr-4 py-3 bg-input-dark border border-border-dark rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-white appearance-none">
<option>Select Category</option>
<option>Dining &amp; Drinks</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Shopping</option>
</select>
</div>
</div>
<div class="col-span-2">
<label class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2 block">Payment Method</label>
<div class="grid grid-cols-3 gap-3">
<label class="cursor-pointer">
<input checked="" class="hidden peer" name="payment" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 border border-border-dark bg-input-dark rounded-xl peer-checked:bg-primary/20 peer-checked:border-primary transition-all group">
<span class="material-symbols-outlined mb-1 text-slate-500 peer-checked:text-primary">credit_card</span>
<span class="text-[9px] font-bold uppercase text-slate-500 peer-checked:text-primary">Card</span>
</div>
</label>
<label class="cursor-pointer">
<input class="hidden peer" name="payment" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 border border-border-dark bg-input-dark rounded-xl peer-checked:bg-primary/20 peer-checked:border-primary transition-all group">
<span class="material-symbols-outlined mb-1 text-slate-500 peer-checked:text-primary">payments</span>
<span class="text-[9px] font-bold uppercase text-slate-500 peer-checked:text-primary">Cash</span>
</div>
</label>
<label class="cursor-pointer">
<input class="hidden peer" name="payment" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 border border-border-dark bg-input-dark rounded-xl peer-checked:bg-primary/20 peer-checked:border-primary transition-all group">
<span class="material-symbols-outlined mb-1 text-slate-500 peer-checked:text-primary">account_balance</span>
<span class="text-[9px] font-bold uppercase text-slate-500 peer-checked:text-primary">Bank</span>
</div>
</label>
</div>
</div>
</div>
<div class="flex flex-col gap-4 pt-4">
<button class="w-full bg-primary hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-xl">check_circle</span>
                    Save Transaction
                </button>
<button class="w-full text-slate-500 hover:text-white text-sm font-semibold py-2 transition-colors" type="button">
                    Cancel and Go Back
                </button>
</div>
</form>
</div>
</div>
<style>.color-scheme-dark {
        color-scheme: dark;
    }
</style>

</body></html>
