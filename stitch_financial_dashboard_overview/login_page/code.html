<body class="text-on-surface min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container bg-[#0b2327]">
<div class="fixed inset-0 bg-mesh -z-10 overflow-hidden">
</div>
<main class="flex-grow flex items-center justify-center px-6 py-12 relative">
<div class="w-full max-w-[440px]">
<div class="mb-10 text-center">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-2">Budget Life</h1>
<p class="text-on-surface-variant font-medium text-sm tracking-wide">THE SOVEREIGN LEDGER</p>
</div>
<div class="bg-surface-container rounded-xl p-8 shadow-sm border border-outline/20 backdrop-blur-md">
<div class="mb-8">
<h2 class="font-headline text-xl font-bold text-on-surface">Welcome Back</h2>
<p class="text-on-surface-variant text-sm mt-1">Access your financial dashboard</p>
</div>
<form class="space-y-5">
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-on-secondary-container" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">mail</span>
<input class="w-full bg-surface-container-high border-none focus:ring-2 focus:ring-primary rounded-xl py-3 pl-10 text-on-surface placeholder:text-on-surface-variant/40 text-sm transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-xs font-bold uppercase tracking-widest text-on-secondary-container" for="password">Password</label>
<a class="text-[10px] uppercase font-bold tracking-widest text-primary hover:text-on-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">lock</span>
<input class="w-full bg-surface-container-high border-none focus:ring-2 focus:ring-primary rounded-xl py-3 pl-10 text-on-surface placeholder:text-on-surface-variant/40 text-sm transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-3 py-2">
<input class="w-4 h-4 rounded border-outline bg-surface-container-high text-primary focus:ring-primary-container focus:ring-offset-background cursor-pointer" id="remember" type="checkbox"/>
<label class="text-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full bg-primary text-on-primary font-headline font-bold py-3.5 rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all" type="submit">
                        Log In
                    </button>
</form>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest">
<span class="bg-surface-container px-4 text-on-surface-variant/60 font-medium">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-high hover:bg-surface-container-highest text-on-surface py-3 rounded-xl border border-outline/10 transition-colors">

<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor"></path>

</button>

<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05 1.61-3.21 1.61-1.12 0-1.49-.69-2.84-.69-1.34 0-1.77.67-2.84.69-1.14.02-2.33-.8-3.41-2.35-2.18-3.14-2.11-7.81.42-10.42 1.25-1.3 2.65-1.99 3.84-1.99 1.12 0 1.9.61 2.8.61.88 0 1.83-.71 3.09-.71 1.15 0 2.45.62 3.31 1.69-2.58 1.48-2.16 4.98.44 6.2-.5 1.47-1.17 2.92-2.1 3.36zm-3.05-16.71c.71-.85 1.19-2.04 1.06-3.23-1.02.04-2.26.68-2.99 1.54-.66.75-1.24 1.97-1.08 3.13 1.14.09 2.3-.6 3.01-1.44z" fill="currentColor"></path>

</div>
</div>

<p class="text-on-surface-variant text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2 transition-all" href="#">Sign Up</a>
</p>

<div class="flex gap-6">

<a class="font-['Manrope'] text-[10px] uppercase tracking-widest text-[#97BDC4]/60 hover:text-[#135D6C] transition-opacity opacity-80 hover:opacity-100" href="#">Terms of Service</a>
