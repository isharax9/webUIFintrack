        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #121e20;
        }
        .headline-font {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Suppressed for Transactional Flow -->
<header class="bg-[#121E20]/50 backdrop-blur-md text-[#135D6C] font-['Plus_Jakarta_Sans'] font-bold tracking-tight border-b border-[#274045]/30 shadow-sm flex justify-between items-center w-full px-8 py-4 sticky top-0 z-50">
<div class="text-xl font-bold text-[#97BDC4]">Budget Life</div>
<div class="flex items-center gap-4">
<button class="hover:text-[#135D6C] transition-colors scale-95 active:duration-100">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-6 sm:p-12 relative overflow-hidden">
<!-- Abstract Background Decoration -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-[120px]"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-tertiary-container rounded-full blur-[120px]"></div>
</div>
<!-- Centric Card Design -->
<div class="w-full max-w-md z-10">
<div class="bg-surface-container rounded-xl shadow-sm overflow-hidden p-8 sm:p-10 border border-outline/10">
<div class="text-center mb-8">
<h1 class="headline-font text-3xl font-bold tracking-tight text-on-background mb-2">Create Account</h1>
<p class="text-on-surface-variant text-sm">Join the Sovereign Ledger to master your finances.</p>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 rounded-xl hover:bg-surface-container-highest transition-colors border border-outline/20">
<img alt="Google Logo" class="w-5 h-5" data-alt="clean minimal google logo icon in flat vector style on a dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxo2tcj45KuypHreCvtmPQXkfM_HUouZ8jcntKyWXJeYzYUr4Be2DgEcbI6xOkOUem6Y-5MYXp0T4QMzM5aemUMYl6-xTfCKibDhpHGqOjnQ85Q0-DV4ckmncbPwyVAMxpKud6rXi9bBziyA3dPO2I90ZkXUQAYAF-PCYeECDUqG1XDkuwuDb5IRMaZEhXTmcMoofK6R0dqIGWXtiSdcUyYkvU1uhrfuxaZ6aEbcwg2f1vzcQ01fKHUoTFfRHbqUEtE-qNBbydyuw"/>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-surface-container-high py-3 rounded-xl hover:bg-surface-container-highest transition-colors border border-outline/20">
<span class="material-symbols-outlined text-xl" data-icon="apple">ios</span>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface">Apple</span>
</button>
</div>
<div class="flex items-center gap-4 mb-8">
<div class="h-px flex-grow bg-outline/20"></div>
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant/50">Or register with email</span>
<div class="h-px flex-grow bg-outline/20"></div>
</div>
<!-- Signup Form -->
<form class="space-y-5">
<div>
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-1.5 ml-1">Full Name</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary transition-all" placeholder="Johnathan Doe" type="text"/>
</div>
<div>
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-1.5 ml-1">Email Address</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary transition-all" placeholder="name@example.com" type="email"/>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-1.5 ml-1">Password</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary transition-all" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="block text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-1.5 ml-1">Confirm</label>
<input class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/30 focus:ring-2 focus:ring-primary transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 bg-surface-container-high border-none rounded focus:ring-primary text-primary" id="terms" type="checkbox"/>
</div>
<label class="text-xs text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<button class="w-full bg-primary text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="button">
<span>Create Account</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline/10 text-center">
<p class="text-sm text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-[#121E20] text-[#135D6C] font-['Manrope'] text-[10px] uppercase tracking-widest border-t border-[#274045]/20 flex flex-col items-center gap-4 w-full py-12">
<div class="text-[#97BDC4] font-bold">Budget Life</div>
<div class="flex gap-8 text-[#97BDC4]/60">
<a class="hover:text-[#135D6C] transition-opacity opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="hover:text-[#135D6C] transition-opacity opacity-80 hover:opacity-100" href="#">Terms of Service</a>
<a class="hover:text-[#135D6C] transition-opacity opacity-80 hover:opacity-100" href="#">Contact Support</a>
</div>
<div class="mt-2 text-[#97BDC4]/40">© 2024 Budget Life. The Sovereign Ledger.</div>
</footer>
